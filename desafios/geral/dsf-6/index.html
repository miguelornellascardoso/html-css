<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>
    <ul type="square">
        <li><abbr title="p">Parágrafo</abbr></li>
        <li><abbr title="h1">Titulos</abbr></li>
        <li><abbr title="img">imagens</abbr></li>
        <li><abbr title="abbr">abreviação</abbr></li>
        <li><abbr title="code">Codigo-Fonte</abbr></li>
        <li><abbr title="ol">Lista numerada</abbr></li>
        <li><abbr title="ul">Lista com demarcadores</abbr></li>

    </ul>
    
</body>
</html>
