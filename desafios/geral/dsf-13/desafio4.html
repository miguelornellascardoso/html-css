<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse:collapse;
            margin: auto;
            width: 500px;
        }
        caption {
            background-color: lightgray;
            padding: 10px;
            font-weight: bold;
            font-size: 1.5em;
            border-radius: 3px 3px 0px 0px;
        }
        thead {
            background-color: rgb(128, 128, 128);
            color: white;
            height: 80px;
        }
        .media {
            background-color:rgb(128, 128, 128);
            color: white;
            font-weight: bold;
            font-size: 1.25em;
        }
        td, th {
            border: 2px solid black;
        }
        td {
            height: 50px;
            padding-left: 10px;
        }
        .notas {
            text-align: center;
            padding: 0px;
        }
    
    </style>
</head>
<body>
<table>
    <caption>Boletim das Provas</caption>
    <thead>
        <tr>
            <th rowspan="2" scope="col">Area</th>
            <th rowspan="2" scope="col">Disciplinas</th>
            <th colspan="2" scope="colgroup">Notas</th>
            <th rowspan="2" scope="col">Media</th>
        </tr>
        <tr>
            <th scope="col">Nota 1</th>
            <th scope="col">Nota 2</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <th rowspan="4" scope="rowgroup">Exatas</th>
            <td>Matematica</td>
            <td class="notas">7.5</td>
            <td class="notas">8.0</td>
            <td class="notas">7.75</td>
        </tr>
        <tr>
            <td>Fisica</td>
            <td class="notas">7.0</td>
            <td class="notas">6.0</td>
            <td class="notas">6.5</td>
        </tr>
        <tr>
            <td>Quimica</td>
            <td class="notas">7.0</td>
            <td class="notas">8.0</td>
            <td class="notas">7.5</td>
        </tr>
        <tr>
            <td>Biologia</td>
            <td class="notas">6.0</td>
            <td class="notas">8.0</td>
            <td class="notas">7.0</td>
        </tr>
        <tr class="media">
            <td colspan="4">Media de Exatas</td>
            <td class="notas">7.2</td>
        </tr>
        <tr>
            <th rowspan="2" scope="rowgroup">Humanas</th>
            <td>Historia</td>
            <td class="notas">7.0</td>
            <td class="notas">9.0</td>
            <td class="notas">8.0</td>
        </tr>
        <tr>
            <td>Geografia</td>
            <td class="notas">10</td>
            <td class="notas">10</td>
            <td class="notas">10</td>
        </tr>
        <tr class="media">
            <td colspan="4">Media de Humanas</td>
            <td class="notas">9.0</td>
        </tr>
    </tbody>   
</table>
</body>
</html>
