<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linhas</h1>
    <hr>
    <p>Eu posso escrever o quanto eu quiser com tanto que esteja entre a tag &lt;p&gt; e &lt;/p&gt;</p> <!-- LESS THAN / GREATER THAN -->
    <p>Mas se você quiser quebrar linha<br>apenas use a tag &lt;br&gt;</p>
    <p>Vamos colocar alguns simbolos
        &reg;
        &copy;
        &trade;
        &euro;
        &pound;
        &yen;
        &cent;
        &Delta;
        &uparrow;
        &uarr;
    </p>
    <p>Vamos colocar alguns emojis
        &#x1F43A;
        &#x1F43B;  
    </p>
</body>
</html>
