<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilizando videos</title>
</head>
<body>
    <h1>Usando videos locais</h1>
    <p>aqui esta meu video muito insano que esta hospedado localmente</p>
    <video width="560px" poster="img/limoes-capa.png" controls loop>
        <source src="midia/meu-video.mp4" type="video/mp4">
        <source src="midia/meu-video.ogv" type="video/ogv">
        <source src="midia/meu-video.m4v" type="video/m4v">
    </video>
    <p>Aqui esta um video que esta sendo hospedado em outro site, nesse caso no youtube.</p>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/DEcvEYkM_G8?si=U616x3vyxDNke6_x" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    
</body>
</html>
