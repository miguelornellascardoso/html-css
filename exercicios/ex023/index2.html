<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>
    <style>
        #container {
            height: 97vh;
            position: relative;
        }
        table {
            background-color: rgb(202, 202, 202);
            border-collapse: collapse;
            position: absolute;

            top:50% ;
            left:50% ;
            transform: translate(-50%, -50%);
        }
        td, th {
            border: 2px solid black;
            width: 200px;
            height: 25px;
            padding-left: 5px;
        }
        .num {
            text-align: right;
            padding-right: 5px;
        }
    </style>
</head>
<body>
        <div id="container">
            <table>
                <thead>
                    <tr>
                        <th>Pais</th>
                        <th>Habitantes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Sao paulo</td>
                        <td class="num">22222222</td>
                    </tr>
                    <tr>
                        <td>Bahia</td>
                        <td class="num">323232323</td>
                    </tr>
                    <tr>
                        <td>Rio de janeiro</td>
                        <td class="num">323232323</td>
                    </tr>
                    <tr>
                        <td>Maranhao</td>
                        <td class="num">323232323</td>
                    </tr>
                    <tr>
                        <td>Fortaleza</td>
                        <td class="num">323232323</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <th>Total de Habitantes</th>
                        <td class="num"><strong>6767676767676767</strong></td>
                    </tr>
                </tfoot>
            </table>
        </div>
</body>
</html>
