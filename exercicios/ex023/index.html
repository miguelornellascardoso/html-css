<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
            background-color: gray;
            border: 5px solid rgb(165, 109, 5);
        }
        tr.yellow {
            background-color:yellow;
        }
        
        td {
            border: 3px solid black;
            padding: 8px;
            width: 200px;
            height: 150px;
            text-align: center;
            vertical-align: top;
        }
        .numero {
            text-align: right;
            vertical-align: middle;

        }
        td.b3 {
            background-color: red;

        } 

    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table>
        <tr class="yellow">
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td class="numero">B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td class="b3">B3</td>
            <td>C3</td>
        </tr>
    </table>
    
</body>
</html>
