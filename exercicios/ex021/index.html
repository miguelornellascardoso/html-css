<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixa</title>
    <style>
        h1 {
            background-image: linear-gradient(to bottom, rgb(167, 102, 102), rgb(104, 104, 154));
            width: 300px;
            height: 300px;
            padding: 10px;
            border: 5px solid rgb(127, 127, 165);
            outline:10px dashed rgb(69, 69, 89);
            margin: 40px auto 50px auto;
        }
        p {
            text-align: center;
        }
        a {
            text-decoration: none;
            color: brown;
            border: 2px solid red;
            outline: 3px dashed rgb(90, 0, 0);
            margin-right: 5px;
            margin-left: 5px; 
            padding-left: 2px;
            padding-right: 2px;
        }
        a:hover {
            text-decoration: underline;
            color: rgb(81, 20, 20);
        }
        a:visited {
            color: rgb(1, 1, 129);
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <h1>Box-level</h1>
    <p>Box-level tambem mas o <a href="#">link é uma tag inline-level</a>, pegou a visão?</p>
    
</body>
</html>
