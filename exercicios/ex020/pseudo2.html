<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo</title>
    <style>
        div:hover {
            color: red;
        }
        div > p {
            display: none;
        }
        div:hover > p {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Titulo</h1>
    <div>coloque o mouse aqui<p>TEXTO ESCONDIDO</p></div>
    
</body>
</html>
