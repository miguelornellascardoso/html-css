<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo classes</title>
    <style>
        div {
            background-color: gray;
            height: 200px;
            width: 200px;
            display: inline-block;
            border: 3px solid black;

        }
        div:hover {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div class="1">01</div>
    <div class="2">02</div>
    <div class="3">03</div>
    
</body>
</html>
