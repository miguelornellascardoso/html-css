<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fundo</title>
    <style> 
        div.cubo {
            margin: 10px;
            height: 150px;
            border: 3px solid black;
            border-radius: 10px;
            background-image: url(imagens/wallpaper003.jpg);
        }
        div#q1 {
            background-position: left top;
        }
        div#q2 {
            background-position: right top;
        }
        div#q3 {
            background-position: center center;
        }
        div#q4 {
            background-position: right bottom;
        }
    </style>
</head>
<body>
    <div class="cubo" id="q1"></div>
    <div class="cubo" id="q2"></div>
    <div class="cubo" id="q3"></div>
    <div class="cubo" id="q4"></div>
   

    
</body>
</html>
