<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <h1>Teste de Formularios</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="ialuno">Aluno:</label>
            <input type="text" name="aluno" id="ialuno" placeholder="Nome Completo"  minlength="6" maxlength="30" size="15" required>
        </p>
        <p>
            <label for="imedia">Média:</label>
            <input type="number" name="media" id="imedia" size="10" min="0" max="10" step="0.1" placeholder="Media" required>
        </p>
        <p>  <label for="imes"> Periodo Letivo:</label>
            <input type="month" name="mes" id="imes" required>
        </p>
        <p><label for="idata">Dia da Prova:</label>
        <input type="date" required></p>
        <p>
            <label for="ihora">Horário da Prova:</label>
            <input type="time" nome="hora" id="ihora" required>
        </p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
